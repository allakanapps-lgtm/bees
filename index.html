const hv=id=>S.hives.find(h=>h.id===id),apo=id=>S.apiaries.find(a=>a.id===id),apn=id=>(apo(id)||{name:'—'}).name;

// ---- notifications (Capacitor Local Notifications, APK only)
const LN=()=>{const C=window.Capacitor;if(!C)return null;try{if(C.Plugins&&C.Plugins.LocalNotifications)return C.Plugins.LocalNotifications;if(C.isNativePlatform&&C.isNativePlatform()&&C.registerPlugin)return LN._p||(LN._p=C.registerPlugin('LocalNotifications'))}catch(e){}return null};

const pend=await ln.getPending();if(pend.notifications&&pend.notifications.length)await ln.cancel({notifications:pend.notifications});if(!S.pro)return;

function compress(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=1024,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.72))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}

function b64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s);return Uint8Array.from(b,c=>c.charCodeAt(0))}

async function verifyCode(code){const m=code.trim().match(/^([A-Za-z0-9]+)-([A-Za-z0-9_-]+)$/);if(!m||!crypto.subtle)return null;let sig=b64(m[2]);if(sig.length!==64)sig=der2raw(sig);if(!sig)return null;

function mlist(){const f=val('mfrom'),ls=S.hives.filter(h=>f==='all'||h.ap===+f).sort(nat);$('#ml').innerHTML=ls.map(h=>`<label class="r" style="cursor:pointer"><span><input type="checkbox" data-mk="${h.id}" ${moveSel.has(h.id)?'checked':''}> <b>#${esc(h.no)}</b> <small style="display:inline">${esc(apn(h.ap))}</small></span></label>`).join('')||'<p class="mut">ما في خلايا.</p>';mcount()}
const mcount=()=>{const e=$('#mcnt');if(e)e.textContent='المحدد: '+moveSel.size+' خلية'};
function openTask(id,pre){const t=id?S.tasks.find(x=>x.id===id):null,p=t||Object.assign({k:'inspect',d:today(),tm:S.set.tm,rep:0,note:''},pre||{});
const tg=p.h?'h:'+p.h:p.ap?'a:'+p.ap:'all';
const opts=[['all','كل الخلايا']].concat(S.apiaries.map(a=>['a:'+a.id,'مرعى: '+a.name])).concat(S.hives.slice().sort(nat).map(h=>['h:'+h.id,'خلية '+hl(h)]));
M(hdr(t?'تعديل موعد':'موعد جديد')+(t?'':`<div><span class="chip" data-act="preset" data-p="insp">🔍 كشف دوري كل 14 يوم</span><span class="chip" data-act="preset" data-p="varroa">💊 مكافحة فاروا</span><span class="chip" data-act="preset" data-p="feed">🍯 تغذية</span></div>`)+sfld('tk','النوع',Object.entries(K).map(([k,v])=>[k,v[0]+' '+v[1]]),p.k)+sfld('ttg','الخلايا',opts,tg)+fld('td','التاريخ','date',p.d)+fld('ttm','الوقت','time',p.tm||S.set.tm)+sfld('trep','التكرار'+(S.pro?'':' 🔒 (النسخة الكاملة)'),[[0,'بدون تكرار'],[7,'كل أسبوع'],[10,'كل 10 أيام'],[14,'كل أسبوعين'],[21,'كل 3 أسابيع'],[30,'كل شهر'],[60,'كل شهرين'],[90,'كل 3 شهور']],p.rep)+fld('tn','ملاحظة','text',p.note)+`<button class="btn w" data-act="tsave" data-id="${id||''}">حفظ</button>`+(t?`<button class="btn s w no" data-act="tdel" data-id="${id}">حذف الموعد</button>`:''))}
function openDone(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;M(hdr('✔ إنجاز: '+K[t.k][0]+' '+K[t.k][1])+`<p class="mut">${esc(tlabel(t))} — ${targets(t).length} خلية</p>`+fld('dd','تاريخ الإنجاز','date',today())+fld('dn','ملاحظة (اختياري)','text','')+`<label><input type="checkbox" id="dl" checked> سجّل بسجل كل خلية</label>`+(t.rep?`<p class="mut">رح يتجدد الموعد تلقائياً (كل ${t.rep} يوم).</p>`:'')+`<button class="btn w" data-act="dsave" data-id="${id}">تأكيد</button>`)}
// ---- actions
document.addEventListener('click',async e=>{if(e.target.id==='modal'){closeM();return}const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,D=el.dataset;
if(a==='tab'){view=D.v;closeM();render();scrollTo(0,0)}
else if(a==='close'){closeM();ret=null}
else if(a==='perm')askPerm()
else if(a==='gopro')openPro('')
else if(a==='act'){const m=$('#amsg');try{const p=await verifyCode(val('code'));if(p===PACK){S.pro=true;save();closeM();render();toast('تم التفعيل ✔')}else m.textContent='✖ الكود غير صحيح'}catch(x){m.textContent='✖ الكود غير صحيح'}}
else if(a==='deact'){S.pro=false;save();render()}
else if(a==='ntest'){const ln=LN();if(ln)try{await ln.schedule({notifications:[{id:999999,title:'نحّالي 🐝',body:'إشعار تجريبي ✔',schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true}}]});toast('بعد 5 ثواني…')}catch(x){toast('تعذّر')}}
else if(a==='hf'){hf=D.f;render()}
else if(a==='tf'){tf=D.f;render()}
else if(a==='hnew')openHiveForm()
else if(a==='hedit')openHiveForm(+D.id)
else if(a==='hopen')openHive(+D.id)
else if(a==='anew')openApForm()
else if(a==='aedit')openApForm(+D.id)
else if(a==='aopen')openAp(+D.id)
else if(a==='asave'){const n=val('an');if(!n)return toast('اكتب الاسم');const ll=val('all')?parseLL(val('all')):'';if(val('all')&&!ll)return toast('الإحداثيات غير صحيحة (مثال: 36.2021, 37.1343)');const ex={ow:val('aow'),ph:val('aph'),ll:ll||'',pl:val('apl'),tm:val('atm')};if(D.id){const x=apo(+D.id);Object.assign(x,ex,{name:n,note:val('ann')})}else{if(!S.pro&&S.apiaries.length>=FREE_APS)return openPro('النسخة المجانية: حتى '+FREE_APS+' مراعي.');S.apiaries.push(Object.assign({id:nid(),name:n,note:val('ann')},ex))}save();closeM();render()}
else if(a==='cpll'){const x=apo(+D.id);copy(x.ll)}
else if(a==='adel'){const id=+D.id;if(hivesOf(id).length)return toast('انقل الخلايا أولاً');if(confirmQ('حذف المرعى؟')){S.apiaries=S.apiaries.filter(x=>x.id!==id);S.tasks=S.tasks.filter(t=>t.ap!==id);save();closeM();render()}}
else if(a==='hsave'){const no=val('fno');if(!no)return toast('اكتب رقم الخلية');const id=D.id?+D.id:null;if(S.hives.some(h=>String(h.no)===no&&h.id!==id))return toast('الرقم موجود');if(!id&&!S.pro&&S.hives.length>=FREE_HIVES)return openPro('النسخة المجانية: حتى '+FREE_HIVES+' خلايا.');const ap=resolveAp('fap');if(ap==null)return;
const o={no,nm:val('fnm'),ap,ty:val('fty'),st:val('fst'),qy:val('fqy')?+val('fqy'):0,qc:val('fqc'),qr:val('fqr'),qo:val('fqo'),qcl:val('fqcl'),qn:val('fqn'),nt:val('fnt')};let hid=id;if(id)Object.assign(hv(id),o);else{hid=nid();S.hives.push(Object.assign({id:hid},o))}save();closeM();render();openHive(hid)}
else if(a==='hbulk'){let f=parseInt(val('bfrom')),t=parseInt(val('bto'));const cn=parseInt(val('bcnt'));if(cn>0){f=S.hives.reduce((m,x)=>Math.max(m,/^\d+$/.test(String(x.no))?+x.no:0),0)+1;t=f+cn-1}if(!(f>=0)||!(t>=f)||t-f>499)return toast('المجال غير صحيح (حد أقصى 500)');if(!S.pro&&S.hives.length>=FREE_HIVES)return openPro('النسخة المجانية: حتى '+FREE_HIVES+' خلايا.');const ap=resolveAp('fap');if(ap==null)return;let n=0;for(let i=f;i<=t;i++){if(S.hives.some(h=>String(h.no)===String(i)))continue;if(!S.pro&&S.hives.length>=FREE_HIVES){toast('وصلت حد النسخة المجانية');break}S.hives.push({id:nid(),no:String(i),nm:'',ap,st:'strong',qy:0,qc:'بدون',qr:'',nt:''});n++}save();closeM();render();toast('أُضيفت '+n+' خلية')}
else if(a==='hdel'){const id=+D.id;if(confirmQ('حذف الخلية مع سجلها؟')){['q','h'].forEach(w=>pdel(id+'-'+w));S.logs.filter(l=>l.h===id&&l.ph).forEach(l=>pdel('l'+l.id));S.hives=S.hives.filter(h=>h.id!==id);S.logs=S.logs.filter(l=>l.h!==id);S.tasks=S.tasks.filter(t=>t.h!==id);save();closeM();render()}}
else if(a==='lnew')openLog(+D.h,D.k)
else if(a==='lsave'){const hid=+D.h,k=D.k,x={};for(const f of LOGF[k]||[]){const v=val('lf_'+f[0]);if(v)x[f[0]]=v}
const lg={id:nid(),h:hid,d:val('ld')||today(),k,t:val('lt'),x};if(curPhoto){await pput('l'+lg.id,curPhoto);lg.ph=true;curPhoto=null}S.logs.push(lg);const h=hv(hid);if(k==='inspect'&&val('lhs'))h.st=val('lhs');if(k==='queen'){if(x.year)h.qy=+x.year;if(x.color&&x.color!=='بدون')h.qc=x.color;if(x.act==='فقدان ملكة')h.st='orphan'}save();closeM();render();openHive(hid)}
else if(a==='lph')pickPhoto(d=>{curPhoto=d;$('#lphv').innerHTML=`<img src="${d}" style="width:120px;border-radius:10px">`})
else if(a==='phadd'){const hid=+D.h,w=D.w;pickPhoto(async d=>{await pput(hid+'-'+w,d);hv(hid)['p'+w]=true;save();openHive(hid)})}
else if(a==='pview')M(hdr('صورة')+`<img data-pk="${D.k}" style="width:100%;border-radius:12px">`+(/^l/.test(D.k)?'':`<button class="btn s w no" data-act="phdel" data-k="${D.k}">🗑 حذف الصورة</button>`)+`<button class="btn w" data-act="back">رجوع</button>`)
else if(a==='back'){cur?openHive(cur):closeM()}
else if(a==='phdel'){const[hid,w]=D.k.split('-');await pdel(D.k);const h=hv(+hid);if(h)h['p'+w]=false;save();openHive(+hid)}
else if(a==='ldel'){if(confirmQ('حذف هالسجل؟')){const lg=S.logs.find(l=>l.id===+D.id);if(lg&&lg.ph)pdel('l'+lg.id);S.logs=S.logs.filter(l=>l.id!==+D.id);save();render();openHive(cur)}}
else if(a==='qlog')openPick(id=>{const h=hv(id);openLog(id,'inspect')})
else if(a==='pk'){const id=+D.id;openLog(id,'inspect')}
else if(a==='mv')openMove([],null)
else if(a==='mv1')openMove([+D.h],hv(+D.h).ap)
else if(a==='mvto')openMove([],null,+D.id)
else if(a==='mvfrom')openMove(hivesOf(+D.id).map(h=>h.id),+D.id)
else if(a==='mrs'){$('#mt').value=D.t}
else if(a==='mall'){const f=val('mfrom');S.hives.filter(h=>f==='all'||h.ap===+f).forEach(h=>moveSel.add(h.id));mlist()}
else if(a==='mrange'){const f=parseInt(val('mrf')),t=parseInt(val('mrt')),fl=val('mfrom');if(!(f>=0)||!(t>=f))return toast('اكتب المجال صح');let n=0;S.hives.filter(h=>(fl==='all'||h.ap===+fl)&&/^\d+$/.test(String(h.no))&&+h.no>=f&&+h.no<=t).forEach(h=>{moveSel.add(h.id);n++});mlist();toast('تم تحديد '+n+' خلية')}
else if(a==='mnone'){moveSel.clear();mlist()}
else if(a==='msave'){if(!moveSel.size)return toast('اختر خلية على الأقل');const dest=resolveAp('mdest');if(dest==null)return;const d=val('md')||today();let n=0;
for(const id of moveSel){const h=hv(id);if(!h||h.ap===dest)continue;S.logs.push({id:nid(),h:id,d,k:'move',t:val('mt'),x:{from:apn(h.ap),to:apn(dest),fi:h.ap,ti:dest}});h.ap=dest;n++}save();closeM();render();toast('تم نقل '+n+' خلية')}
else if(a==='tnew')openTask()
else if(a==='tnewh')openTask(null,{h:+D.h})
else if(a==='tnewap')openTask(null,{ap:+D.id})
else if(a==='tedit')openTask(+D.id)
else if(a==='preset'){const P={insp:['inspect',14,'كشف دوري'],varroa:['treat',0,'مكافحة فاروا'],feed:['feed',0,'تغذية']}[D.p];$('#tk').value=P[0];$('#trep').value=P[1];$('#tn').value=P[2]}
else if(a==='tsave'){const d=val('td');if(!d)return toast('اختر التاريخ');const tg=val('ttg'),o={k:val('tk'),h:tg.startsWith('h:')?+tg.slice(2):null,ap:tg.startsWith('a:')?+tg.slice(2):null,d,tm:val('ttm')||S.set.tm,rep:S.pro?+val('trep'):0,note:val('tn')};if(D.id)Object.assign(S.tasks.find(t=>t.id===+D.id),o);else S.tasks.push(Object.assign({id:nid(),done:false},o));save();closeM();render()}
else if(a==='tdel'){if(confirmQ('حذف الموعد؟')){S.tasks=S.tasks.filter(t=>t.id!==+D.id);save();closeM();render()}}
else if(a==='tdone')openDone(+D.id)
else if(a==='dsave'){const t=S.tasks.find(x=>x.id===+D.id),d=val('dd')||today();if(!t)return;if($('#dl').checked)for(const h of targets(t))S.logs.push({id:nid(),h:h.id,d,k:t.k,t:val('dn')||t.note||'',x:{}});
t.done=true;t.dn=d;if(t.rep){let nx=addDays(t.d,t.rep);if(nx<=today())nx=addDays(today(),t.rep);S.tasks.push({id:nid(),k:t.k,h:t.h,ap:t.ap,d:nx,tm:t.tm,rep:t.rep,note:t.note,done:false})}save();closeM();render()}
else if(a==='sset'){S.set.tm=val('stm')||'08:00';S.set.lead=+val('slead');S.set.insp=Math.max(1,+val('sinsp')||14);save();render();toast('تم الحفظ')}
else if(a==='bk'){if(!S.pro)return openPro('النسخة الاحتياطية بالنسخة الكاملة.');const tx=JSON.stringify(S);try{await navigator.clipboard.writeText(tx);toast('تم النسخ ✔')}catch(x){const t=$('#rs');t.value=tx;t.select();try{document.execCommand('copy');toast('تم النسخ ✔')}catch(_){toast('انسخ النص يدوياً')}}}
else if(a==='rest'){if(!S.pro)return openPro('الاسترجاع بالنسخة الكاملة.');try{const j=JSON.parse(val('rs'));if(!Array.isArray(j.hives)||!Array.isArray(j.apiaries)||!Array.isArray(j.logs)||!Array.isArray(j.tasks))throw 0;if(!confirmQ('رح تُستبدل بياناتك الحالية. متابعة؟'))return;S=Object.assign({apiaries:[],hives:[],logs:[],tasks:[],nid:1,did:S.did,pro:true},j,{did:S.did,pro:true});S.set=Object.assign({tm:'08:00',lead:0,insp:14,theme:'auto'},S.set||{});save();render();toast('تم الاسترجاع ✔')}catch(x){toast('النسخة غير صالحة')}}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.mk){const id=+el.dataset.mk;el.checked?moveSel.add(id):moveSel.delete(id);mcount();return}
if(el.id==='mfrom')mlist();if(el.id==='mdest')mdinfo();
if(el.id==='fap'||el.id==='mdest'){const n=$('#'+el.id+'n');if(n)n.style.display=el.value==='__new'?'block':'none'}
if(el.id==='sth'){S.set.theme=el.value;save();render()}});
document.addEventListener('input',e=>{if(e.target.id==='pq')pickList()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncNotifs();render()}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
refreshPerm().then(()=>{render();syncNotifs()});render();
</script></body></html>
