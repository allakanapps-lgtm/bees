const REFAR={dis:[{s:"طفيلي خارجي يتغذى على النحل والعذارى. أجنحة مشوّهة، عذارى مكشوفة أو بدون رأس، ويرقات غائرة، وتراجع بعدد النحل البالغ.",dg:"غسيل بالكحول: خذ حوالي 300 نحلة (نصف كوب) من إطار الحضنة، غطّها بكحول أو ماء صابوني في برطمان، رجّه دقيقة كاملة، صفّه وعدّ الفاروا. النسبة = عدد الفاروا ÷ عدد النحل × 100. عدّ كل 3 إلى 4 أسابيع من الربيع وأكثر بنهاية الصيف والخريف. (بالتطبيق: سجل «عدّ فاروا» يحسب النسبة لك.)",m:"النسبة 2% فأكثر تعني خطراً على الخلية وتحتاج علاجاً (وتختلف العتبة حسب الموسم). عالج كل نحل المنحل بنفس الوقت، بدّل نوع الدواء بين السنوات لتجنب المقاومة، وافحص النتيجة بعدّ جديد."},
{s:"نحل زاحف أمام الخلية لا يقدر يطير، ارتجاف وأجنحة متباعدة، بقع براز على الإطارات وخارج الخلية، بطون منتفخة. النوع ceranae قد لا تظهر له أعراض واضحة.",dg:"يحتاج فحصاً مجهرياً.",m:"غذاء نظيف للشتاء، تبديل إطارات الحضنة القديمة بانتظام، التخلص من الإطارات المبقّعة بالبراز، وتغيير الملكة بملكة شابة. تعقيم المعدات الجافة بالحرارة (حوالي 49°م لمدة 24 ساعة). دواء النوزيما وجرعته حسب ملصق المنتج وإرشاد الجهة البيطرية."},
{s:"حضنة مبقّعة غير منتظمة، أغطية غائرة مثقوبة ورطبة، يرقات بنية داكنة تموت واقفة، ورائحة تشبه اللحم الفاسد أو الكبريت.",dg:"اختبار الخيط: ادخل عود أسنان بغطاء مشتبه واسحبه ببطء؛ إذا امتدت مادة بنية لزجة حوالي 1.3 سم أو أكثر فاحتمال AFB مرتفع جداً. القشور المتيبسة سوداء لامعة ملتصقة بجدار العين.",m:"مرض خطير تعيش جراثيمه عقوداً طويلة. أبلغ الجهة البيطرية أو الزراعية فوراً. في كثير من الدول تُعدم الخلية المصابة وتُحرق، ولا تُنقل إطارات منها لخلايا أخرى. المضادات الحيوية محدودة النجاح وقد تعود الإصابة. لا تُطعم النحل عسلاً مجهول المصدر."},
{s:"غالباً في أواخر الربيع. حضنة غير منتظمة، يرقات صفراء إلى بنية تموت قبل التغطية وتلتوي بشكل C، بقايا مائية لا تمتد كالخيط، ورائحة حامضة.",dg:"بالأعراض وغياب «الخيط»؛ والتشخيص البيطري مطلوب قبل أي مضاد حيوي.",m:"الحالات الخفيفة قد تتحسن مع وفرة الرحيق. الشديدة: تبديل الملكة وربما علاج بوصفة بيطرية. عقّم المعدات الشديدة الإصابة أو أتلفها."},
{s:"غالباً بالربيع. يرقات بيضاء رخوة ثم «مومياءات» بيضاء متصلبة (قد تكون رمادية أو سوداء) تتجمع على الأرضية وعند المدخل.",dg:"مشاهدة المومياءات عند المدخل وعلى الأرضية.",m:"لا يوجد دواء مسجّل. تهوية جيدة، تجنّب الأماكن الباردة الرطبة، وسلالات نحل نظيفة أكثر مقاومة."},
{s:"يرقات تتحول من أبيض لؤلؤي إلى رمادي ثم أسود، منتفخة مليئة بسائل، ورأس أسود منكمش.",dg:"لا تمتد كالخيط (يميّزها عن AFB).",m:"لا علاج. خلايا قوية ومكافحة الفاروا وسلالات مقاومة. نادراً ما تقتل الخلية."},
{s:"خيوط حرير على الأقراص، أنفاق في الشمع، فضلات بنية صغيرة على الأرضية، وشرانق على جوانب الصناديق.",dg:"",m:"آفة ثانوية تصيب الخلايا الضعيفة: حافظ على خلايا قوية. خزّن المعدات بمكان بارد جيد التهوية، جمّد الإطارات الخفيفة الإصابة (تقتل البيض واليرقات)، وأحرق الشديدة."},
{s:"أكثر من 20 فيروساً، أشهرها تشوه الأجنحة (DWV) وينتقل ويتفعّل بسبب الفاروا.",dg:"",m:"لا علاج مباشر. الأساس مكافحة الفاروا، خلايا قوية، وملكات مقاومة."}],
drugs:{apivar:{dose:"شريط لكل 5 براويز مغطاة بالنحل (غالباً شريطان لصندوق حضنة 10 براويز)",how:"يُعلَّق الشريط في قلب عش الحضنة بين الإطارات. أزل العاسلات قبل العلاج.",dur:"من 6 إلى 10 أسابيع (لا تتجاوز 70 يوماً)",note:"لا تقطف عسلاً أثناء العلاج، وراجع ملصق منتجك لمدة الانتظار قبل رجوع العاسلات."},
apistan:{dose:"شريطان لكل صندوق حضنة (واحد بين الإطارين 3 و4 والآخر بين 7 و8)؛ شريط واحد للخلايا الصغيرة والنوى",how:"تُعلَّق بين إطارات الحضنة بحيث يمشي النحل على جانبيها. لا توضع في العاسلات.",dur:"من 6 إلى 8 أسابيع ولا تزيد عن 8",note:"لا يُستعمل أثناء موسم الرحيق. ظهرت مقاومة عند بعض الفاروا؛ لا تعِد تدوير شمع الخلايا المعالجة."},
oxalic:{dose:"5 مل من المحلول لكل فاصل (بين إطارين) فيه نحل، بحد أقصى 50 مل للخلية",how:"المحلول: 35 غ حمض أوكساليك ثنائي الماء لكل لتر شراب سكر 1:1 (600 مل ماء + 600 غ سكر). استعمل ماء طرياً وارمِ المحلول إذا ظهر راسب أبيض. دخّن النحل ثم صبّ المحلول على النحل مباشرة لا على الخشب.",dur:"مرة واحدة",note:"يُستعمل عندما تكون الحضنة قليلة أو معدومة (أواخر الخريف / الشتاء) لأنه لا يقتل الفاروا داخل الحضنة المغلقة. ارتدِ قفازات ونظارات وكمامة. التبخير: اتبع تعليمات المنتج والجهاز."},
formic:{dose:"شريطان للخلية فوق عش الحضنة",how:"الطريقة العادية: شريطان 14 يوماً. طريقة 1+1: شريط 10 أيام ثم الثاني 10 أيام (20 يوماً). افتح المدخل بالكامل (لا يقل عن 1.3 سم) ولا تقدّم تغذية أثناء العلاج.",dur:"14 يوماً (أو 20 بطريقة 1+1)",note:"حرارة النهار 10 إلى 29.5°م في أول 3 أيام (33°م فأكثر قد تسبب خسارة نحل أو حضنة أو ملكة). لا يصلح للنوى والتقسيمات الجديدة. اترك شهراً بين علاجين، وافحص الفاروا بعد أسبوع من النهاية. ارتدِ قفازات ونظارات."},
thymol:{dose:"علبة 50 غ لكل 10 براويز مغطاة بالنحل",how:"علبة أولى، وبعد أسبوعين علبة ثانية؛ تبقى كل علبة من أسبوعين إلى 4 أسابيع. فوق 25°م: جرعات مخفّضة. الخلايا الصغيرة (5 براويز أو أقل): نصف الجرعة.",dur:"حوالي 6 أسابيع (علبتان)",note:"يُطبَّق فوق 15°م، من الصيف إلى الخريف، وتجنّب موسم الرحيق. أبقِ المدخل مفتوحاً."},
broodbreak:{dose:"—",how:"حبس الملكة بقفص حوالي 21 يوماً (مدة نمو الشغالة) حتى لا تبقى حضنة مغلقة، فتصير الفاروا مكشوفة على النحل ويسهل علاجها (مثلاً بالأوكساليك).",dur:"حوالي 21 يوماً",note:"قيّم النتيجة بعدّ الفاروا."}},
feed:[{b:"جزء سكر : جزء ماء، وزناً أو حجماً (مثلاً 1 كغ سكر + 1 لتر ماء). للربيع لتشجيع بناء الأقراص وتربية الحضنة وللخلايا الخفيفة. يُقدَّم عادة بجو دافئ.",t:"الربيع، أو عند قلة المخزون"},
{b:"جزءان سكر : جزء ماء (مثلاً 2 كغ سكر + 1 لتر ماء). للخريف ليخزّنه النحل للشتاء. استعمل سكراً أبيض نقياً؛ السكر البني أو الخام فيه شوائب قد تضر النحل.",t:"الخريف"},
{b:"وصفة 1: 2.3 كغ (5 رطل) سكر حبيبي + حوالي 0.47 لتر ماء، سخّن حتى 115.5°م (240°ف) ثم برّد إلى 82–93°م وصبّ بالقوالب. وصفة 2: 5.4 كغ سكر + 0.7 كغ جلوكوز سائل + حوالي 1.2 لتر ماء + ربع ملعقة صغيرة كريم تارتار، اغلِ حتى 114°م (238°ف) وبرّد ثم صبّ. كلما ارتفعت حرارة الغلي صار الكاندي أقسى. تفقّد الخلايا المغذّاة بالكاندي كل 7 إلى 10 أيام.",t:"الشتاء وأواخره عندما لا يقدر النحل على أخذ الشراب البارد"},
{b:"2 كوب سكر + 2 ملعقة كبيرة شراب ذرة + 1 كوب ماء. أذب السكر واغلِ 3 دقائق والوعاء مغطى، ثم بدون غطاء ودون تحريك حتى 114°م (238°ف). برّد إلى 43°م وحرّك حتى يصير كريمياً أبيض، وشكّله بين ورقتين شمعيتين. يُفضّل قطعتان صغيرتان على جانبي العنقود بدل قطعة كبيرة.",t:"بداية الموسم / تغذية خفيفة"},
{b:"للطوارئ فقط: سكر حبيبي فوق الغطاء الداخلي أو على ورق جرائد فوق الإطارات.",t:"طوارئ"},
{b:"تُوضع أواخر الشتاء والربيع لتحفيز تربية الحضنة وقت قلة حبوب اللقاح. اتبع تعليمات المصنّع للمنتج الذي تشتريه.",t:"أواخر الشتاء والربيع"},
{b:"• لا تُقدّم تغذية داخل الخلية أثناء علاج Formic Pro.\n• الكميات لكل خلية تتبع قوة الخلية والموسم؛ سجّل ما تعطيه بسجل «تغذية» لتتابع.\n• يتوقف النحل عن أخذ الغذاء الإضافي عند تفتح الرحيق.",t:""}]};

const REFEN={dis:[
{s:'An external parasite that feeds on adult bees and brood. Signs: deformed wings, exposed or headless pupae, sunken larvae, and a shrinking adult population.',dg:'Alcohol wash: take about 300 bees (half a cup) from a brood frame, cover them with alcohol or soapy water in a jar, shake for a full minute, strain and count the mites. Percentage = mites ÷ bees × 100. Count every 3 to 4 weeks from spring, and more often at the end of summer and in autumn when mites multiply. (In the app, the "Varroa count" log calculates the percentage for you.)',m:'2% or more means danger to the colony and needs treatment (the threshold varies with the season). Treat all the bees in the apiary at the same time, rotate treatment types between years to avoid resistance, and check the result with a new count.'},
{s:'Bees crawling in front of the hive unable to fly, trembling and spread wings, fecal spots on frames and outside the hive, swollen abdomens. The ceranae type may show no clear symptoms.',dg:'Needs a microscope examination.',m:'Clean winter feed, regular replacement of old brood comb, removing frames spotted with feces, and replacing the queen with a young one. Sterilize dry equipment with heat (about 49°C for 24 hours). Nosema medication and its dose follow the product label and veterinary advice.'},
{s:'Patchy, irregular brood; sunken, perforated, moist cappings; dark brown larvae that die upright; a smell like rotten meat or sulfur.',dg:'Ropiness test: insert a toothpick into a suspect cell and pull it out slowly; if a sticky brown thread stretches about 1.3 cm or more, AFB is very likely. Dry scales are black, glossy and stuck to the cell wall.',m:'A serious disease whose spores survive for decades. Report it to the veterinary or agricultural authority immediately. In many countries the infected colony is destroyed and burned, and frames from it must never be moved to other hives. Antibiotics have limited success and the disease may return. Never feed bees honey of unknown origin.'},
{s:'Usually late spring. Irregular brood; yellow to brown larvae that die before capping and twist into a C shape; watery remains that do not stretch like a thread; a sour smell.',dg:'By symptoms and the absence of the "rope"; a veterinary diagnosis is required before any antibiotic.',m:'Mild cases may improve with a good nectar flow. Severe cases: replace the queen and possibly treat under veterinary prescription. Sterilize or destroy heavily infected equipment.'},
{s:'Usually in spring. Soft white larvae then hard white "mummies" (may be grey or black) collecting on the bottom board and at the entrance.',dg:'Seeing the mummies at the entrance and on the floor.',m:'No registered medicine. Good ventilation, avoid cold damp locations, and hygienic bee stocks are more resistant.'},
{s:'Larvae turn from pearly white to grey then black, swollen and filled with fluid inside the skin, with a shrunken black head.',dg:'Does not stretch like a thread (this distinguishes it from AFB).',m:'No cure. Strong colonies, varroa control and resistant stock. It rarely kills a colony.'},
{s:'Silk threads on combs, tunnels in the wax, small brown droppings on the floor, and cocoons on the sides of boxes.',dg:'',m:'A secondary pest of weak colonies: keep colonies strong. Store equipment in a cool, well-ventilated place, freeze lightly infested frames (kills eggs and larvae), and burn heavily infested ones.'},
{s:'More than 20 viruses, the best known being deformed wing virus (DWV), which is spread and activated by varroa.',dg:'',m:'No direct cure. The basis is varroa control, strong colonies and resistant queens.'}],
drugs:{
apivar:{dose:'One strip per 5 frames covered with bees (usually two strips for a 10-frame brood box)',how:'Hang the strip in the centre of the brood nest between the frames. Remove honey supers before treatment.',dur:'6 to 10 weeks (do not exceed 70 days)',note:'Do not harvest honey during treatment, and check your product label for the waiting period before supers go back.'},
apistan:{dose:'Two strips per brood box (one between frames 3 and 4, the other between 7 and 8); one strip for small hives and nucs',how:'Hang between brood frames so bees walk on both sides. Do not place in honey supers.',dur:'6 to 8 weeks, no more than 8',note:'Do not use during a nectar flow. Resistance has appeared in some mites; do not recycle the wax of treated hives.'},
oxalic:{dose:'5 ml of solution per seam (between two frames) containing bees, maximum 50 ml per hive',how:'Solution: 35 g oxalic acid dihydrate per litre of 1:1 sugar syrup (600 ml water + 600 g sugar). Use soft water and discard the solution if a white sediment appears. Smoke the bees, then pour the solution directly on the bees, not on the wood.',dur:'Once',note:'Used when there is little or no brood (late autumn / winter) because it does not kill mites inside capped brood. Wear gloves, goggles and a mask. Vaporizing: follow the product and device instructions.'},
formic:{dose:'Two strips per hive above the brood nest',how:'Standard method: two strips for 14 days. 1+1 method: one strip for 10 days then the second for 10 days (20 days). Open the entrance fully (at least 1.3 cm) and do not feed during treatment.',dur:'14 days (or 20 with the 1+1 method)',note:'Daytime temperature 10 to 29.5°C in the first 3 days (33°C or more may cause loss of bees, brood or queen). Not suitable for nucs and new splits. Leave a month between two treatments and check varroa a week after the end. Wear gloves and goggles.'},
thymol:{dose:'One 50 g tray per 10 frames covered with bees',how:'First tray, then a second tray after two weeks; each tray stays from two to 4 weeks. Above 25°C: reduced doses. Small hives (5 frames or fewer): half dose.',dur:'About 6 weeks (two trays)',note:'Apply above 15°C, from summer to autumn, and avoid the nectar flow. Keep the entrance open.'},
broodbreak:{dose:'—',how:'Cage the queen for about 21 days (worker development time) so no capped brood remains, leaving the mites exposed on the bees where they are easier to treat (for example with oxalic acid).',dur:'About 21 days',note:'Evaluate the result with a varroa count.'}},

{b:'One part sugar : one part water, by weight or volume (for example 1 kg sugar + 1 litre water). For spring, to encourage comb building and brood rearing and for light colonies. Usually offered in warm weather.',t:'Spring, or when stores are low'},
{b:'Two parts sugar : one part water (for example 2 kg sugar + 1 litre water). For autumn so bees store it for winter. Use pure white sugar; brown or raw sugar contains impurities that may harm bees.',t:'Autumn'},
{b:'Recipe 1: 2.3 kg (5 lb) granulated sugar + about 0.47 litre water, heat to 115.5°C (240°F), cool to 82–93°C, then pour into molds. Recipe 2: 5.4 kg sugar + 0.7 kg liquid glucose + about 1.2 litres water + a quarter teaspoon cream of tartar, boil to 114°C (238°F), cool, then pour. The higher the boiling temperature, the harder the candy. Check candy-fed hives every 7 to 10 days.',t:'Winter and late winter when bees cannot take cold syrup'},
{b:'2 cups sugar + 2 tablespoons corn syrup + 1 cup water. Dissolve the sugar and boil 3 minutes covered, then uncovered without stirring to 114°C (238°F). Cool to 43°C and stir until creamy white, and shape between two sheets of wax paper. Two small pieces on the sides of the cluster are better than one large piece.',t:'Start of season / light feeding'},
{b:'Emergency only: granulated sugar above the inner cover or on newspaper over the frames.',t:'Emergency'},

return `<div class="r ${!alive(h)?'dim':''}" data-act="hopen" data-id="${h.id}" style="cursor:pointer"><div><b>#${esc(h.no)}${h.nm?' · '+esc(h.nm):''}</b><small>${esc(apn(h.ap))} · ${HS[h.st]||''}${h.qy?' · 👑 '+h.qy+(QE[h.qc]?' '+QE[h.qc]:''):''}</small><small>${li?'آخر كشف: '+rel(li.d):'<span class="no">لم تُكشف بعد</span>'}${nt?' · 📅 '+rel(nt.d):''}</small></div><span class="mut">${ARW()}</span></div>`}

const need=S.hives.filter(alive).filter(h=>{const l=lastLog(h.id,'inspect');return !l||diffDays(td,l.d)>=S.set.insp}).sort(nat);
let h=`<h1>🐝 نحّالي</h1>`;

if(S.pro&&perm==='none')h+=`<div class="banner">الإشعارات بتشتغل بنسخة التطبيق (APK). هون عم تشوف المواعيد بس داخل الصفحة.</div>`;
