function der2raw(d){if(d[0]!==0x30)return null;let i=2;if(d[1]&0x80)i=2+(d[1]&0x7f);const rd=()=>{if(d[i]!==2)return null;let l=d[i+1];i+=2;let v=d.slice(i,i+l);i+=l;while(v.length>32&&v[0]===0)v=v.slice(1);const o=new Uint8Array(32);o.set(v,32-v.length);return o};const r=rd(),s=rd();if(!r||!s)return null;const o=new Uint8Array(64);o.set(r);o.set(s,32);return o}
async function verifyCode(code){const m=code.trim().match(/^([A-Za-z0-9]+)-([A-Za-z0-9_-]+)$/);if(!m||!crypto.subtle)return null;let sig=b64(m[2]);if(sig.length!==64)sig=der2raw(sig);if(!sig)return null;
const key=await crypto.subtle.importKey('spki',b64(PUB),{name:'ECDSA',namedCurve:'P-256'},false,['verify']);const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,sig,new TextEncoder().encode(S.did+'|'+m[1]));return ok?m[1]:null}

else if(a==='preset'){const P={insp:['inspect',14,'كشف دوري'],varroa:['treat',0,'مكافحة فاروا'],feed:['feed',0,'تغذية']}[D.p];$('#tk').value=P[0];$('#trep').value=P[1];$('#tn').value=P[2]}
else if(a==='tsave'){const d=val('td');if(!d)return toast('اختر التاريخ');const tg=val('ttg'),o={k:val('tk'),h:tg.startsWith('h:')?+tg.slice(2):null,ap:tg.startsWith('a:')?+tg.slice(2):null,d,tm:val('ttm')||S.set.tm,rep:S.pro?+val('trep'):0,note:val('tn')};if(D.id)Object.assign(S.tasks.find(t=>t.id===+D.id),o);else S.tasks.push(Object.assign({id:nid(),done:false},o));save();closeM();render()}
else if(a==='tdel'){if(confirmQ('حذف الموعد؟')){S.tasks=S.tasks.filter(t=>t.id!==+D.id);save();closeM();render()}}
else if(a==='tdone')openDone(+D.id)
else if(a==='dsave'){const t=S.tasks.find(x=>x.id===+D.id),d=val('dd')||today();if(!t)return;if($('#dl').checked)for(const h of targets(t))S.logs.push({id:nid(),h:h.id,d,k:t.k,t:val('dn')||t.note||'',x:{}});
t.done=true;t.dn=d;if(t.rep){let nx=addDays(t.d,t.rep);if(nx<=today())nx=addDays(today(),t.rep);S.tasks.push({id:nid(),k:t.k,h:t.h,ap:t.ap,d:nx,tm:t.tm,rep:t.rep,note:t.note,done:false})}save();closeM();render()}
else if(a==='sset'){S.set.tm=val('stm')||'08:00';S.set.lead=+val('slead');S.set.insp=Math.max(1,+val('sinsp')||14);S.set.qage=Math.max(1,+val('sqage')||3);save();render();toast('تم الحفظ')}
else if(a==='bk'){if(!S.pro)return openPro('النسخة الاحتياطية بالنسخة الكاملة.');const tx=JSON.stringify(S);try{await navigator.clipboard.writeText(tx);toast('تم النسخ ✔')}catch(x){const t=$('#rs');t.value=tx;t.select();try{document.execCommand('copy');toast('تم النسخ ✔')}catch(_){toast('انسخ النص يدوياً')}}}
else if(a==='rest'){if(!S.pro)return openPro('الاسترجاع بالنسخة الكاملة.');try{const j=JSON.parse(val('rs'));if(!Array.isArray(j.hives)||!Array.isArray(j.apiaries)||!Array.isArray(j.logs)||!Array.isArray(j.tasks))throw 0;if(!confirmQ('رح تُستبدل بياناتك الحالية. متابعة؟'))return;S=Object.assign({apiaries:[],hives:[],logs:[],tasks:[],drugs:[],nid:1,did:S.did,pro:true},j,{did:S.did,pro:true});S.set=Object.assign({tm:'08:00',lead:0,insp:14,qage:3,theme:'auto'},S.set||{});save();render();toast('تم الاسترجاع ✔')}catch(x){toast('النسخة غير صالحة')}}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.mk){const id=+el.dataset.mk;el.checked?moveSel.add(id):moveSel.delete(id);mcount();return}
if(el.id==='mfrom')mlist();if(el.id==='mdest')mdinfo();
if(el.id==='fap'||el.id==='mdest'){const n=$('#'+el.id+'n');if(n)n.style.display=el.value==='__new'?'block':'none'}
if(el.id==='ry')openReport(el.value);
if(el.id==='sth'){S.set.theme=el.value;save();render()}});
document.addEventListener('input',e=>{if(e.target.id==='pq')pickList();if(e.target.id==='lf_pr'){const d=allDrugs().find(x=>x.n===e.target.value);if(d){const set=(i,v)=>{const el=$('#'+i);if(el&&!el.value&&v)el.value=v};set('lf_dose',d.dose&&d.dose!=='—'?d.dose:'');set('lf_days',d.days||'');const g=$('#lf_ds');if(g&&d.g&&[...g.options].some(o=>o.value===d.g))g.value=d.g;const n=$('#drinfo');if(n)n.textContent=[d.how,d.dur?'المدة: '+d.dur:'',d.note].filter(Boolean).join(' — ')}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncNotifs();render()}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
refreshPerm().then(()=>{render();syncNotifs()});render();
</script></body></html>
