{s:'An external parasite that feeds on adult bees and brood. Signs: deformed wings, exposed or headless pupae, sunken larvae, and a shrinking adult population.',dg:'Alcohol wash: take about 300 bees (half a cup) from a brood frame, cover them with alcohol or soapy water in a jar, shake for a full minute, strain and count the mites. Percentage = mites ÷ bees × 100. Count every 3 to 4 weeks from spring, and more often at the end of summer and in autumn when mites multiply. (In the app, the "Varroa count" log calculates the percentage for you.)',m:'2% or more means danger to the colony and needs treatment (the threshold varies with the season). Treat all the bees in the apiary at the same time, rotate treatment types between years to avoid resistance, and check the result with a new count.'},
{s:'Bees crawling in front of the hive unable to fly, trembling and spread wings, fecal spots on frames and outside the hive, swollen abdomens. The ceranae type may show no clear symptoms.',dg:'Needs a microscope examination.',m:'Clean winter feed, regular replacement of old brood comb, removing frames spotted with feces, and replacing the queen with a young one. Sterilize dry equipment with heat (about 49°C for 24 hours). Nosema medication and its dose follow the product label and veterinary advice.'},
{s:'Patchy, irregular brood; sunken, perforated, moist cappings; dark brown larvae that die upright; a smell like rotten meat or sulfur.',dg:'Ropiness test: insert a toothpick into a suspect cell and pull it out slowly; if a sticky brown thread stretches about 1.3 cm or more, AFB is very likely. Dry scales are black, glossy and stuck to the cell wall.',m:'A serious disease whose spores survive for decades. Report it to the veterinary or agricultural authority immediately. In many countries the infected colony is destroyed and burned, and frames from it must never be moved to other hives. Antibiotics have limited success and the disease may return. Never feed bees honey of unknown origin.'},
{s:'Usually late spring. Irregular brood; yellow to brown larvae that die before capping and twist into a C shape; watery remains that do not stretch like a thread; a sour smell.',dg:'By symptoms and the absence of the "rope"; a veterinary diagnosis is required before any antibiotic.',m:'Mild cases may improve with a good nectar flow. Severe cases: replace the queen and possibly treat under veterinary prescription. Sterilize or destroy heavily infected equipment.'},
{s:'Usually in spring. Soft white larvae then hard white "mummies" (may be grey or black) collecting on the bottom board and at the entrance.',dg:'Seeing the mummies at the entrance and on the floor.',m:'No registered medicine. Good ventilation, avoid cold damp locations, and hygienic bee stocks are more resistant.'},
{s:'Larvae turn from pearly white to grey then black, swollen and filled with fluid inside the skin, with a shrunken black head.',dg:'Does not stretch like a thread (this distinguishes it from AFB).',m:'No cure. Strong colonies, varroa control and resistant stock. It rarely kills a colony.'},
{s:'Silk threads on combs, tunnels in the wax, small brown droppings on the floor, and cocoons on the sides of boxes.',dg:'',m:'A secondary pest of weak colonies: keep colonies strong. Store equipment in a cool, well-ventilated place, freeze lightly infested frames (kills eggs and larvae), and burn heavily infested ones.'},
{s:'More than 20 viruses, the best known being deformed wing virus (DWV), which is spread and activated by varroa.',dg:'',m:'No direct cure. The basis is varroa control, strong colonies and resistant queens.'}],
